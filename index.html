<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Taller y Vulka Villarreal · Tarifario</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
:root { --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#111827; --chip:#eef2f7; --price:#0f766e; }
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.shell{max-width:720px;margin:0 auto;min-height:100vh;padding:18px 14px 42px}
.header{padding:8px 4px 14px;text-align:center} .brandLogo{display:block;margin:0 auto 10px;max-width:250px;width:100%;height:auto;border-radius:14px;background:#fff;padding:8px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(17,24,39,.06)} .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800} h1{font-size:30px;line-height:1.05;margin:5px 0 6px} .sub{color:var(--muted);font-size:14px}
.searchWrap{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 14px}
.searchBox{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(17,24,39,.07);border-radius:18px;padding:10px;display:flex;gap:8px;align-items:center}
.searchBox svg{width:22px;height:22px;color:#6b7280;flex:none} input{width:100%;border:0;outline:0;font-size:19px;padding:7px 2px;background:transparent;color:var(--ink)} button.clear{border:0;background:#f3f4f6;border-radius:999px;width:34px;height:34px;font-size:18px;display:none;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px} .chips::-webkit-scrollbar{display:none} .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer} .chip.active{background:var(--accent);color:white;border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:3px 2px 10px} .meta strong{color:var(--ink)}
.results{display:grid;gap:10px} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(17,24,39,.035)}
.system{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:5px} .service{font-size:17px;line-height:1.22;font-weight:800} .price{font-size:25px;font-weight:900;color:var(--price);white-space:nowrap} .note{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:12px}
.empty{background:var(--card);border:1px dashed #cbd5e1;border-radius:18px;padding:28px 20px;text-align:center;color:var(--muted)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.45}
mark{background:#fef3c7;color:inherit;border-radius:4px;padding:0 1px}
@media (max-width:420px){h1{font-size:27px} .service{font-size:16px} .price{font-size:23px} .card{padding:14px}}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <img class="brandLogo" src="logo.jpg" alt="Taller y Vulka Villarreal" />
    <div class="eyebrow">Consulta rápida</div>
    <h1>Tarifario de mecánica rápida</h1>
    <div class="sub">Taller y Vulka Villarreal · Precios sugeridos de mano de obra</div>
  </header>

  <section class="searchWrap">
    <div class="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Ej. balatas, aceite, escáner…" autocomplete="off" autofocus />
      <button class="clear" id="clear" aria-label="Limpiar">×</button>
    </div>
  </section>

  <div class="chips" id="chips"></div>
  <div class="meta"><span id="count"></span><span>63 servicios</span></div>
  <section class="results" id="results"></section>
  <div class="footer">El precio mostrado corresponde a mano de obra sugerida. Refacciones y trabajos adicionales se cotizan por separado.</div>
</main>
<script>
const SERVICES=[{"sistema": "Mantenimiento preventivo", "servicio": "Cambio de aceite y filtro", "precio": 350, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Cambio de filtro de aire", "precio": 150, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Cambio de filtro de cabina", "precio": 200, "aliases": ["filtro polen", "aire cabina"]}, {"sistema": "Mantenimiento preventivo", "servicio": "Cambio de bujías", "precio": 400, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Cambio de correas auxiliares", "precio": 550, "aliases": ["banda", "bandas", "correa"]}, {"sistema": "Mantenimiento preventivo", "servicio": "Cambio de líquido de dirección", "precio": 250, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Cambio de líquido refrigerante", "precio": 450, "aliases": ["anticongelante", "coolant"]}, {"sistema": "Mantenimiento preventivo", "servicio": "Rotación de llantas", "precio": 300, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Balanceo de llantas", "precio": 350, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Alineación delantera", "precio": 450, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Alineación y balanceo", "precio": 600, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Inspección multipuntos", "precio": 350, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Reapriete de suspensión", "precio": 400, "aliases": []}, {"sistema": "Mantenimiento preventivo", "servicio": "Cambio de líquido de transmisión", "precio": 650, "aliases": ["aceite transmision", "transmision"]}, {"sistema": "Frenos", "servicio": "Cambio de balatas delanteras", "precio": 450, "aliases": ["pastillas", "frenos delanteros"]}, {"sistema": "Frenos", "servicio": "Cambio de balatas traseras", "precio": 550, "aliases": ["pastillas", "frenos traseros"]}, {"sistema": "Frenos", "servicio": "Rectificado de discos (mano de obra)", "precio": 650, "aliases": []}, {"sistema": "Frenos", "servicio": "Cambio de discos delanteros", "precio": 700, "aliases": []}, {"sistema": "Frenos", "servicio": "Cambio de caliper", "precio": 550, "aliases": []}, {"sistema": "Frenos", "servicio": "Cambio de mangueras de freno", "precio": 450, "aliases": []}, {"sistema": "Frenos", "servicio": "Cambio de zapatas tambor", "precio": 900, "aliases": []}, {"sistema": "Frenos", "servicio": "Cambio de sensor ABS rueda", "precio": 400, "aliases": []}, {"sistema": "Frenos", "servicio": "Sangrado completo", "precio": 450, "aliases": []}, {"sistema": "Frenos", "servicio": "Cambio de líquido de frenos", "precio": 300, "aliases": []}, {"sistema": "Suspensión", "servicio": "Cambio de amortiguadores delanteros", "precio": 900, "aliases": []}, {"sistema": "Suspensión", "servicio": "Cambio de amortiguadores traseros", "precio": 550, "aliases": []}, {"sistema": "Suspensión", "servicio": "Cambio de rótulas", "precio": 900, "aliases": ["rotula", "rotulas"]}, {"sistema": "Suspensión", "servicio": "Cambio de terminales dirección", "precio": 550, "aliases": ["terminal direccion", "terminales"]}, {"sistema": "Suspensión", "servicio": "Cambio de barra estabilizadora (bujes)", "precio": 650, "aliases": []}, {"sistema": "Suspensión", "servicio": "Cambio de bieletas", "precio": 450, "aliases": ["bieleta", "cacahuate"]}, {"sistema": "Suspensión", "servicio": "Cambio de horquilla completa", "precio": 1000, "aliases": []}, {"sistema": "Suspensión", "servicio": "Cambio de topes", "precio": 350, "aliases": []}, {"sistema": "Suspensión", "servicio": "Cambio de cazoletas", "precio": 600, "aliases": []}, {"sistema": "Suspensión", "servicio": "Revisión y ajuste de suspensión", "precio": 450, "aliases": []}, {"sistema": "Dirección", "servicio": "Cambio de depósito hidráulico", "precio": 300, "aliases": []}, {"sistema": "Dirección", "servicio": "Ajuste de eje intermedio", "precio": 350, "aliases": []}, {"sistema": "Dirección", "servicio": "Cambio de junta cardánica", "precio": 600, "aliases": []}, {"sistema": "Dirección", "servicio": "Revisión completa dirección", "precio": 450, "aliases": []}, {"sistema": "Enfriamiento", "servicio": "Cambio de termostato", "precio": 550, "aliases": []}, {"sistema": "Enfriamiento", "servicio": "Cambio de mangueras principales", "precio": 650, "aliases": []}, {"sistema": "Enfriamiento", "servicio": "Cambio de depósito de expansión", "precio": 350, "aliases": []}, {"sistema": "Enfriamiento", "servicio": "Cambio de sensor ECT", "precio": 350, "aliases": []}, {"sistema": "Enfriamiento", "servicio": "Limpieza de sistema (flush)", "precio": 650, "aliases": ["lavado radiador", "flush radiador", "anticongelante"]}, {"sistema": "Enfriamiento", "servicio": "Cambio de tapa radiador", "precio": 150, "aliases": []}, {"sistema": "Enfriamiento", "servicio": "Cambio de switch térmico", "precio": 400, "aliases": []}, {"sistema": "Enfriamiento", "servicio": "Reparación de fuga menor", "precio": 650, "aliases": []}, {"sistema": "Motor", "servicio": "Limpieza de cuerpo de aceleración", "precio": 450, "aliases": []}, {"sistema": "Motor", "servicio": "Cambio de sensor MAP", "precio": 350, "aliases": []}, {"sistema": "Motor", "servicio": "Cambio de sensor MAF", "precio": 350, "aliases": []}, {"sistema": "Transmisión", "servicio": "Servicio de caja automática (aceite/filtro)", "precio": 1100, "aliases": ["transmision automatica", "aceite caja", "servicio transmision"]}, {"sistema": "Transmisión", "servicio": "Cambio de aceite de caja manual", "precio": 450, "aliases": ["transmision manual", "aceite caja"]}, {"sistema": "Transmisión", "servicio": "Cambio de sensor VSS", "precio": 350, "aliases": []}, {"sistema": "Eléctrico / Electrónico", "servicio": "Diagnóstico con escáner OBD-II", "precio": 350, "aliases": ["scanner", "escaner", "check engine", "obd", "diagnostico"]}, {"sistema": "Eléctrico / Electrónico", "servicio": "Cambio de alternador", "precio": 650, "aliases": []}, {"sistema": "Eléctrico / Electrónico", "servicio": "Cambio de motor de arranque", "precio": 650, "aliases": ["marcha", "arranque"]}, {"sistema": "Eléctrico / Electrónico", "servicio": "Cambio de batería", "precio": 200, "aliases": ["bateria", "acumulador"]}, {"sistema": "Eléctrico / Electrónico", "servicio": "Cambio de sensor oxígeno (upstream)", "precio": 400, "aliases": ["sensor o2", "oxigeno"]}, {"sistema": "Eléctrico / Electrónico", "servicio": "Cambio de sensor oxígeno (downstream)", "precio": 450, "aliases": ["sensor o2", "oxigeno"]}, {"sistema": "Eléctrico / Electrónico", "servicio": "Reparación de tierra de chasis", "precio": 350, "aliases": []}, {"sistema": "Aire acondicionado", "servicio": "Carga de gas y detección de fugas", "precio": 550, "aliases": ["clima", "aire acondicionado", "gas a/c", "gas ac"]}, {"sistema": "Aire acondicionado", "servicio": "Cambio de sensor de presión", "precio": 350, "aliases": []}, {"sistema": "Aire acondicionado", "servicio": "Cambio de resistor soplador", "precio": 400, "aliases": []}, {"sistema": "Aire acondicionado", "servicio": "Revisión integral A/A", "precio": 450, "aliases": ["clima", "aire acondicionado", "a/c", "ac"]}];
const q=document.getElementById('q'), results=document.getElementById('results'), count=document.getElementById('count'), clear=document.getElementById('clear'), chips=document.getElementById('chips');
let active='Todos';
const cats=['Todos',...new Set(SERVICES.map(x=>x.sistema))];
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n)}
function renderChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===active?'active':''}" data-cat="${c}">${c}</button>`).join(''); chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderChips();render();})}
function score(item, term){if(!term)return 1; const s=norm(item.servicio), sys=norm(item.sistema), a=norm((item.aliases||[]).join(' ')); if(s===term)return 100; if(s.startsWith(term))return 80; if(s.includes(term))return 60; if(a.includes(term))return 50; if(sys.includes(term))return 20; const words=term.split(' ').filter(Boolean); const bag=s+' '+a+' '+sys; return words.every(w=>bag.includes(w))?40:0}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const term=norm(q.value); clear.style.display=q.value?'block':'none'; let arr=SERVICES.map(x=>[x,score(x,term)]).filter(([x,sc])=>sc>0 && (active==='Todos'||x.sistema===active)).sort((a,b)=>b[1]-a[1]||a[0].servicio.localeCompare(b[0].servicio,'es')).map(x=>x[0]); count.innerHTML=`<strong>${arr.length}</strong> resultado${arr.length===1?'':'s'}`;
 if(!arr.length){results.innerHTML=`<div class="empty"><b>No encontré ese servicio.</b><br><br>Prueba con otra palabra, por ejemplo: <i>frenos</i>, <i>aceite</i>, <i>batería</i> o <i>clima</i>.</div>`;return}
 results.innerHTML=arr.map(x=>`<article class="card"><div><div class="system">${esc(x.sistema)}</div><div class="service">${esc(x.servicio)}</div></div><div class="price">${money(x.precio)}</div></article>`).join('');
}
q.addEventListener('input',render); clear.onclick=()=>{q.value='';q.focus();render()}; renderChips(); render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
